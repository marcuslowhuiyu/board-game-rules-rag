version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      types:
        patterns:
          - '@types/*'
      dev-tooling:
        patterns:
          - eslint*
          - typescript*
          - prettier
          - vitest
          - vite
          - '@vitejs/*'
          - '@testing-library/*'
      aws-cdk:
        patterns:
          - aws-cdk*
          - '@aws-cdk/*'
          - constructs

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
