version: 2
# Monthly, one grouped PR per ecosystem: each Dependabot PR costs a CI run
# (ADR-0009). Security updates are not affected by this schedule.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      npm-all:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions-all:
        patterns:
          - '*'
