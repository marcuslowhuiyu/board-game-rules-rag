name: CI (docs only)

# Branch protection requires the "Lint / Typecheck / Test / Synth" check, but
# ci.yml ignores docs-only PRs to save minutes (ADR-0009), so on those PRs the
# required check would wait forever. This stub reports that check as passing
# when every changed file is docs. A PR that also touches code triggers both
# workflows (path filters can't say "only docs"); there the stub fails, so it
# can never stand in for the real job.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ci-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint / Typecheck / Test / Synth
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Confirm the PR changes only docs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          code_files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' \
            | grep -v -E '\.md$|^docs/' || true)
          if [ -n "$code_files" ]; then
            echo "Non-docs files changed; ci.yml runs the real check:"
            echo "$code_files"
            exit 1
          fi
          echo "Docs-only PR; full CI not needed."
