name: CI

# Actions minutes are tightly budgeted (ADR-0009). This workflow runs only on
# ready-for-review PRs that touch code; draft PRs and docs-only changes skip
# it, and merges to main are not re-checked (the PR run already gated them).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint / Typecheck / Test / Synth
    # Skipped jobs cost no minutes. Mark the PR ready for review to run CI.
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: CDK synth
        run: pnpm synth

      # Folded in from the former security.yml: a separate job would bill its
      # own minimum minute and repeat the install. Non-blocking, as before.
      - name: Audit
        run: pnpm audit --prod --audit-level=high || echo "audit findings reviewed; see log"
