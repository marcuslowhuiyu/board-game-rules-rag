name: Deploy dev

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: CDK deploy → dev
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ap-southeast-1
      CDK_DEFAULT_REGION: ap-southeast-1
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK synth
        run: pnpm -C infrastructure/cdk synth -c githubRepo=${{ github.repository }}

      - name: CDK deploy dev
        run: pnpm -C infrastructure/cdk deploy:dev -c githubRepo=${{ github.repository }}
        env:
          GIT_COMMIT: ${{ github.sha }}

      - name: Resolve stack outputs
        id: outputs
        run: |
          set -euo pipefail
          get() {
            aws cloudformation describe-stacks \
              --stack-name BgrDevStack \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" \
              --output text
          }
          {
            echo "api_url=$(get ApiUrl)"
            echo "cf_api_url=$(get CloudFrontApiUrl)"
            echo "distribution_domain=$(get DistributionDomain)"
            echo "distribution_id=$(get DistributionId)"
            echo "web_bucket=$(get WebBucketName)"
            echo "content_table=$(get ContentTableName)"
            echo "documents_table=$(get DocumentsTableName)"
            echo "chunks_table=$(get ChunksTableName)"
            echo "ingestion_jobs_table=$(get IngestionJobsTableName)"
            echo "ingestion_bucket=$(get IngestionBucketName)"
            echo "state_machine_arn=$(get IngestionStateMachineArn)"
          } >> "$GITHUB_OUTPUT"

      - name: Smoke test /health (direct API)
        run: |
          set -euo pipefail
          URL="${{ steps.outputs.outputs.api_url }}/health"
          echo "Hitting $URL"
          curl -fsS "$URL" | tee /tmp/health.json
          test "$(jq -r '.status' < /tmp/health.json)" = "ok"

      - name: Seed demo game + expansion + promo
        id: seed
        env:
          BASE: ${{ steps.outputs.outputs.api_url }}
          CONTENT_TABLE: ${{ steps.outputs.outputs.content_table }}
        run: |
          set -euo pipefail

          echo "Listing games…"
          LIST=$(curl -fsS "$BASE/games?q=twilight-imperium-4")
          COUNT=$(echo "$LIST" | jq '.items | length')

          if [ "$COUNT" = "0" ]; then
            echo "Seeding Twilight Imperium 4…"
            curl -fsS -X POST "$BASE/games" \
              -H "content-type: application/json" \
              -d '{"name":"Twilight Imperium 4","publisher":"Fantasy Flight Games","initialEdition":{"name":"4th Edition","publisher":"FFG","releaseYear":2017}}' \
              | tee /tmp/game.json > /dev/null
          else
            echo "$LIST" | jq '.items[0]' > /tmp/game.json
          fi

          GAME_ID=$(jq -r '.gameId' < /tmp/game.json)
          EDITION_ID=$(jq -r '.editions[0].editionId' < /tmp/game.json)
          echo "gameId=$GAME_ID editionId=$EDITION_ID"
          echo "game_id=$GAME_ID" >> "$GITHUB_OUTPUT"
          echo "edition_id=$EDITION_ID" >> "$GITHUB_OUTPUT"

          # Seed representative optional content directly to DynamoDB.
          # Idempotent: put-item overwrites so re-runs converge to the same
          # rows. Content ids are deterministic per (gameId, contentType).
          seed_content() {
            local content_id="$1" slug="$2" name="$3" content_type="$4"
            aws dynamodb put-item \
              --table-name "$CONTENT_TABLE" \
              --item "{
                \"gameId\":       {\"S\": \"$GAME_ID\"},
                \"contentId\":    {\"S\": \"$content_id\"},
                \"editionId\":    {\"S\": \"$EDITION_ID\"},
                \"slug\":         {\"S\": \"$slug\"},
                \"name\":         {\"S\": \"$name\"},
                \"contentType\":  {\"S\": \"$content_type\"},
                \"dependencies\": {\"L\": []},
                \"status\":       {\"S\": \"READY\"}
              }"
          }
          seed_content "c_base"       "base-game"         "Base Game"         "BASE"
          seed_content "c_pok"        "prophecy-of-kings" "Prophecy of Kings" "EXPANSION"
          seed_content "c_codex_vol1" "codex-vol-1"       "Codex Vol 1"       "PROMO"

      - name: Exercise the M1 acceptance flow (with expansion + promo)
        env:
          BASE: ${{ steps.outputs.outputs.api_url }}
          GAME_ID: ${{ steps.seed.outputs.game_id }}
          EDITION_ID: ${{ steps.seed.outputs.edition_id }}
        run: |
          set -euo pipefail

          # Content is visible through the API.
          echo "Fetching content for game…"
          curl -fsS "$BASE/games/$GAME_ID/content" | tee /tmp/content.json > /dev/null
          test "$(jq '.items | length' < /tmp/content.json)" -ge 2
          test "$(jq -r '.items[] | select(.contentType == "EXPANSION") | .contentId' < /tmp/content.json | head -1)" = "c_pok"
          test "$(jq -r '.items[] | select(.contentType == "PROMO") | .contentId' < /tmp/content.json | head -1)" = "c_codex_vol1"

          # Start a session with both packages enabled.
          echo "Starting a session with expansion + promo…"
          curl -fsS -X POST "$BASE/sessions" \
            -H "content-type: application/json" \
            -c /tmp/cookies.txt \
            -d "{\"gameId\":\"$GAME_ID\",\"editionId\":\"$EDITION_ID\",\"enabledContentIds\":[\"c_pok\",\"c_codex_vol1\"]}" \
            | tee /tmp/session.json > /dev/null

          test "$(jq -r '.gameId' < /tmp/session.json)" = "$GAME_ID"
          test "$(jq -r '.editionId' < /tmp/session.json)" = "$EDITION_ID"
          test "$(jq -c '.enabledContentIds | sort' < /tmp/session.json)" = '["c_codex_vol1","c_pok"]'
          grep -q bgr_session /tmp/cookies.txt

          # And the same session round-trips through GET.
          SESSION_ID=$(jq -r '.sessionId' < /tmp/session.json)
          curl -fsS "$BASE/sessions/$SESSION_ID" | tee /tmp/session_get.json > /dev/null
          test "$(jq -r '.sessionId' < /tmp/session_get.json)" = "$SESSION_ID"

          # Rejects content from an unknown edition.
          echo "Confirming server rejects content bound to a different edition…"
          set +e
          curl -sS -X POST "$BASE/sessions" \
            -H "content-type: application/json" \
            -d "{\"gameId\":\"$GAME_ID\",\"editionId\":\"$EDITION_ID\",\"enabledContentIds\":[\"c_bogus\"]}" \
            -o /tmp/reject.json -w "%{http_code}" > /tmp/reject_code.txt
          set -e
          test "$(cat /tmp/reject_code.txt)" = "400"

          echo "M1 acceptance flow: OK"

      - name: Exercise the M2 ingestion flow (upload HTML fixture, poll job, verify chunks)
        env:
          BASE: ${{ steps.outputs.outputs.api_url }}
          GAME_ID: ${{ steps.seed.outputs.game_id }}
          EDITION_ID: ${{ steps.seed.outputs.edition_id }}
          DOCUMENTS_TABLE: ${{ steps.outputs.outputs.documents_table }}
          CHUNKS_TABLE: ${{ steps.outputs.outputs.chunks_table }}
          INGESTION_JOBS_TABLE: ${{ steps.outputs.outputs.ingestion_jobs_table }}
        run: |
          set -euo pipefail

          FIXTURE=evals/fixtures/ingestion/living-rules.html
          BYTES=$(wc -c < "$FIXTURE" | tr -d ' ')
          CT="text/html"

          # 1) Presign
          echo "Requesting presigned PUT for $FIXTURE ($BYTES bytes)"
          PRESIGN=$(curl -fsS -X POST "$BASE/uploads/presign" \
            -H "content-type: application/json" \
            -d "{\"filename\":\"living-rules.html\",\"contentType\":\"$CT\",\"sizeBytes\":$BYTES}")
          echo "$PRESIGN" > /tmp/presign.json
          UPLOAD_URL=$(jq -r '.url' < /tmp/presign.json)
          S3_KEY=$(jq -r '.key' < /tmp/presign.json)

          # 2) PUT the file
          echo "Uploading fixture to S3…"
          curl -fsS -X PUT "$UPLOAD_URL" \
            -H "content-type: $CT" \
            --data-binary "@$FIXTURE"

          # 3) Start ingestion
          echo "Starting ingestion job (S3 source)…"
          curl -fsS -X POST "$BASE/ingestion" \
            -H "content-type: application/json" \
            -d "{
              \"gameId\":\"$GAME_ID\",
              \"editionId\":\"$EDITION_ID\",
              \"contentId\":\"c_base\",
              \"title\":\"M2 smoke fixture\",
              \"sourceType\":\"LIVING_RULES\",
              \"authority\":\"OFFICIAL_RULES\",
              \"source\":{\"kind\":\"S3\",\"s3Key\":\"$S3_KEY\",\"contentType\":\"$CT\",\"filename\":\"living-rules.html\"}
            }" > /tmp/job.json
          JOB_ID=$(jq -r '.jobId' < /tmp/job.json)
          echo "Job: $JOB_ID"

          # 4) Poll the job for up to 90 s
          echo "Polling job status…"
          for attempt in $(seq 1 30); do
            curl -fsS "$BASE/ingestion/$JOB_ID" > /tmp/job.json
            STATUS=$(jq -r '.status' < /tmp/job.json)
            STAGE=$(jq -r '.stage' < /tmp/job.json)
            echo "  attempt=$attempt status=$STATUS stage=$STAGE"
            if [ "$STATUS" = "SUCCEEDED" ] || [ "$STATUS" = "FAILED" ]; then break; fi
            sleep 3
          done
          test "$(jq -r '.status' < /tmp/job.json)" = "SUCCEEDED"
          CHUNKS=$(jq -r '.chunkCount' < /tmp/job.json)
          DOC_ID=$(jq -r '.documentId' < /tmp/job.json)
          echo "Job succeeded — documentId=$DOC_ID chunkCount=$CHUNKS"
          test "$CHUNKS" -ge 1

          # 5) Fetch the source via the API
          curl -fsS "$BASE/sources/$DOC_ID" > /tmp/source.json
          test "$(jq -r '.status' < /tmp/source.json)" = "CURRENT"
          test "$(jq -r '.sourceType' < /tmp/source.json)" = "LIVING_RULES"

          # 6) Fetch chunks; each must have a heading path and page range
          curl -fsS "$BASE/sources/$DOC_ID/chunks" > /tmp/chunks.json
          test "$(jq '.items | length' < /tmp/chunks.json)" = "$CHUNKS"
          test "$(jq '.items[0].headingPath | length' < /tmp/chunks.json)" -ge 1

          # 7) Re-run the same upload → dedup, no new document, revision unchanged.
          REV_BEFORE=$(aws dynamodb get-item --table-name "${{ steps.outputs.outputs.content_table }}" \
            --key "{\"gameId\":{\"S\":\"$GAME_ID\"},\"contentId\":{\"S\":\"c_base\"}}" \
            --query 'Item.editionId.S' --output text || true)
          # A second upload creates a fresh S3 key + fresh job, but content hash matches.
          PRESIGN2=$(curl -fsS -X POST "$BASE/uploads/presign" \
            -H "content-type: application/json" \
            -d "{\"filename\":\"living-rules.html\",\"contentType\":\"$CT\",\"sizeBytes\":$BYTES}")
          UPLOAD_URL2=$(jq -r '.url' <<< "$PRESIGN2")
          S3_KEY2=$(jq -r '.key' <<< "$PRESIGN2")
          curl -fsS -X PUT "$UPLOAD_URL2" -H "content-type: $CT" --data-binary "@$FIXTURE"
          curl -fsS -X POST "$BASE/ingestion" -H "content-type: application/json" \
            -d "{
              \"gameId\":\"$GAME_ID\",
              \"editionId\":\"$EDITION_ID\",
              \"contentId\":\"c_base\",
              \"title\":\"M2 smoke fixture (again)\",
              \"sourceType\":\"LIVING_RULES\",
              \"authority\":\"OFFICIAL_RULES\",
              \"source\":{\"kind\":\"S3\",\"s3Key\":\"$S3_KEY2\",\"contentType\":\"$CT\",\"filename\":\"living-rules.html\"}
            }" > /tmp/job2.json
          JOB2=$(jq -r '.jobId' < /tmp/job2.json)
          for attempt in $(seq 1 30); do
            curl -fsS "$BASE/ingestion/$JOB2" > /tmp/job2.json
            STATUS=$(jq -r '.status' < /tmp/job2.json)
            if [ "$STATUS" = "SUCCEEDED" ] || [ "$STATUS" = "FAILED" ]; then break; fi
            sleep 3
          done
          test "$(jq -r '.status' < /tmp/job2.json)" = "SUCCEEDED"
          test "$(jq -r '.documentId' < /tmp/job2.json)" = "$DOC_ID"
          test "$(jq -r '.duplicateOf' < /tmp/job2.json)" = "$DOC_ID"
          echo "Duplicate short-circuit: OK"

          # 8) SSRF guard — a job that targets EC2 metadata must fail at FETCH.
          curl -fsS -X POST "$BASE/ingestion" -H "content-type: application/json" \
            -d "{
              \"gameId\":\"$GAME_ID\",
              \"editionId\":\"$EDITION_ID\",
              \"contentId\":\"c_base\",
              \"title\":\"SSRF probe\",
              \"sourceType\":\"LIVING_RULES\",
              \"authority\":\"OFFICIAL_RULES\",
              \"source\":{\"kind\":\"URL\",\"url\":\"http://169.254.169.254/latest/meta-data/\"}
            }" > /tmp/ssrf.json
          SSRF_JOB=$(jq -r '.jobId' < /tmp/ssrf.json)
          for attempt in $(seq 1 20); do
            curl -fsS "$BASE/ingestion/$SSRF_JOB" > /tmp/ssrf.json
            STATUS=$(jq -r '.status' < /tmp/ssrf.json)
            if [ "$STATUS" = "SUCCEEDED" ] || [ "$STATUS" = "FAILED" ]; then break; fi
            sleep 3
          done
          test "$(jq -r '.status' < /tmp/ssrf.json)" = "FAILED"
          test "$(jq -r '.error.stage' < /tmp/ssrf.json)" = "FETCH"

          echo "M2 ingestion flow: OK"

      - name: Build frontend (same-origin /api)
        # No VITE_API_URL — the SPA hits `/api/*` on CloudFront (ADR-0007).
        run: pnpm -C apps/web build

      - name: Upload frontend to S3 + invalidate CloudFront
        env:
          BUCKET: ${{ steps.outputs.outputs.web_bucket }}
          DIST_ID: ${{ steps.outputs.outputs.distribution_id }}
        run: |
          set -euo pipefail
          aws s3 sync apps/web/dist "s3://$BUCKET" --delete
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"

      - name: Same-origin smoke test via CloudFront /api/health
        env:
          CF_API_URL: ${{ steps.outputs.outputs.cf_api_url }}
        run: |
          set -euo pipefail
          echo "Waiting for CloudFront to propagate /api/health (up to 5m)…"
          URL="$CF_API_URL/health"
          for attempt in $(seq 1 20); do
            if curl -fsS "$URL" -o /tmp/cf-health.json 2>/dev/null; then
              if [ "$(jq -r '.status' < /tmp/cf-health.json)" = "ok" ]; then
                echo "CloudFront /api/* routing: OK (attempt $attempt)"
                exit 0
              fi
            fi
            sleep 15
          done
          echo "CloudFront /api/health did not respond OK after 5m"
          exit 1
