name: Deploy dev

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: CDK deploy → dev
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ap-southeast-1
      CDK_DEFAULT_REGION: ap-southeast-1
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Debug OIDC token claims
        uses: actions/github-script@v7
        with:
          script: |
            const audience = 'sts.amazonaws.com';
            const token = await core.getIDToken(audience);
            const payload = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            core.info(`iss=${payload.iss}`);
            core.info(`aud=${payload.aud}`);
            core.info(`sub=${payload.sub}`);
            core.info(`ref=${payload.ref}`);
            core.info(`environment=${payload.environment}`);
            core.info(`event_name=${payload.event_name}`);

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK synth
        run: pnpm -C infrastructure/cdk synth -c githubRepo=${{ github.repository }}

      - name: CDK deploy dev
        run: pnpm -C infrastructure/cdk deploy:dev -c githubRepo=${{ github.repository }}
        env:
          GIT_COMMIT: ${{ github.sha }}

      - name: Resolve API URL
        id: apiurl
        run: |
          URL=$(aws cloudformation describe-stacks \
            --stack-name BgrDevStack \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Smoke test /health
        run: |
          set -euo pipefail
          URL="${{ steps.apiurl.outputs.url }}/health"
          echo "Hitting $URL"
          curl -fsS "$URL" | tee /tmp/health.json
          test "$(jq -r '.status' < /tmp/health.json)" = "ok"

      - name: Build frontend
        run: pnpm -C apps/web build

      - name: Upload frontend to S3 + invalidate CloudFront
        run: |
          set -euo pipefail
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name BgrDevStack \
            --query "Stacks[0].Outputs[?OutputKey=='WebBucketName'].OutputValue" \
            --output text)
          DIST_ID=$(aws cloudformation describe-stacks \
            --stack-name BgrDevStack \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" \
            --output text)
          aws s3 sync apps/web/dist "s3://$BUCKET" --delete
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
